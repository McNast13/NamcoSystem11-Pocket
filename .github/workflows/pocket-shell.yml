name: Pocket shell build
# Full Quartus compile (map, fit, timing) of pocket/project on the Pocket's real device with real pins.
on:
  workflow_dispatch:
    inputs:
      project:
        description: "project revision under pocket/project"
        default: "s11"
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - run: git submodule update --init --depth 1 references/SYSTEM11_MiSTer references/openfpga-PlayStation references/Laxer-PS-GTE references/PSX_MiSTer
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache
      - name: Core source tree (full build only)
        if: ${{ inputs.project == 's11full' }}
        run: python3 tools/build_core_tree.py pocket/build/core_tree
      - name: Compile
        shell: bash
        run: |
          docker run --rm -v "$PWD/pocket:/pocket" -w /pocket/project raetro/quartus:pocket \
            sh -c "quartus_sh --flow compile ${{ inputs.project }}" | tee build.log || true
      - name: Summary
        if: always()
        run: |
          { echo '```'; cat pocket/project/output_files/*.fit.summary 2>/dev/null; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shell-${{ inputs.project }}
          path: |
            pocket/project/output_files/*.rpt
            pocket/project/output_files/*.summary
            pocket/project/output_files/*.smsg
            build.log
