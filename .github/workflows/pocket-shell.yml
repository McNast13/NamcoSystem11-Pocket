name: Pocket shell build
# Full Quartus compile (map, fit, timing) of pocket/project on the Pocket's real device with real pins.
on:
  workflow_dispatch:
    inputs:
      project:
        description: "project revision under pocket/project"
        default: "s11"
      qsf_extra:
        description: "extra QSF lines appended to the generated s11full.qsf (experiments); use \\n between lines"
        default: ""
      no_mdec:
        description: "drop MDEC (frees ~600 ALMs; no FMVs)"
        type: boolean
        default: false
      label:
        description: "artifact label"
        default: ""
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - run: git submodule update --init --depth 1 references/SYSTEM11_MiSTer references/openfpga-PlayStation references/Laxer-PS-GTE references/PSX_MiSTer
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache
      - name: Core source tree (full build only)
        if: ${{ inputs.project == 's11full' }}
        env:
          S11_NO_MDEC: ${{ inputs.no_mdec && '1' || '0' }}
        run: python3 tools/build_core_tree.py pocket/build/core_tree
      - name: Extra QSF lines
        if: ${{ inputs.qsf_extra != '' }}
        env:
          QSF_EXTRA: ${{ inputs.qsf_extra }}
        run: printf '\n%b\n' "$QSF_EXTRA" >> pocket/project/${{ inputs.project }}.qsf
      - name: Compile
        shell: bash
        run: |
          docker run --rm -v "$PWD/pocket:/pocket" -w /pocket/project raetro/quartus:pocket \
            sh -c "quartus_sh --flow compile ${{ inputs.project }}; quartus_sta -t report_paths.tcl ${{ inputs.project }}" | tee build.log || true
      - name: Package (SD card tree without ROMs)
        if: ${{ always() && inputs.project != 's11' && hashFiles('pocket/project/output_files/*.rbf') != '' }}
        run: python3 tools/package_pocket.py --rbf pocket/project/output_files/${{ inputs.project }}.rbf --out pocket/package
      - name: Summary
        if: always()
        run: |
          { echo '```'; cat pocket/project/output_files/*.fit.summary 2>/dev/null; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shell-${{ inputs.project }}${{ inputs.label && format('-{0}', inputs.label) || '' }}
          path: |
            pocket/project/output_files/*.rpt
            pocket/project/output_files/paths.*
            pocket/project/output_files/*.summary
            pocket/project/output_files/*.smsg
            build.log
      - uses: actions/upload-artifact@v4
        if: ${{ always() && inputs.project != 's11' }}
        with:
          name: pocket-package${{ inputs.label && format('-{0}', inputs.label) || '' }}
          path: pocket/package
          if-no-files-found: ignore
