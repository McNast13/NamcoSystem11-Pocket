name: Pocket resource probe
# Synthesizes the S11 `emu` module alone for the Pocket's Cyclone V 5CEBA4 and reports resource use.
on:
  workflow_dispatch:
    inputs:
      variant:
        description: "variant script in synth/pocket_probe/variants (empty = unmodified)"
        default: ""
      fit:
        description: "also run quartus_fit (virtual pins)"
        type: boolean
        default: false
      device:
        description: "override FPGA part for the fit (e.g. 5CEBA9F23C8 to measure true ALMs of a design too big for the Pocket)"
        default: ""
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - run: git submodule update --init --depth 1 references/SYSTEM11_MiSTer references/openfpga-PlayStation references/Laxer-PS-GTE references/PSX_MiSTer
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache
      - name: Synthesize
        shell: bash
        run: |
          mkdir -p work && cp -r references/SYSTEM11_MiSTer/. work/
          # comma-separated variants; each may have a host-side .apply script and/or a container .sh
          for v in $(echo "${{ inputs.variant }}" | tr ',' ' '); do
            [ -f "synth/pocket_probe/variants/$v.apply" ] && python3 "synth/pocket_probe/variants/$v.apply" work references/openfpga-PlayStation references/Laxer-PS-GTE references/PSX_MiSTer
          done
          docker run --rm -e FIT=${{ inputs.fit && 1 || 0 }} -e FIT_DEVICE="${{ inputs.device }}" -v "$PWD/work:/build" -v "$PWD/synth/pocket_probe:/probe:ro" -w /build \
            raetro/quartus:pocket /probe/run.sh "${{ inputs.variant }}" | tee map.log
      - name: Summary
        if: always()
        run: |
          { echo '```'; cat work/output_files/probe.map.summary 2>/dev/null; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: probe-${{ inputs.variant || 'baseline' }}${{ inputs.device && format('-{0}', inputs.device) || '' }}${{ inputs.fit && '-fit' || '' }}
          path: |
            work/output_files/probe.map.*
            work/output_files/probe.fit.*
            map.log
